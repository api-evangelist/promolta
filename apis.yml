name: Promolta
description: >-
  Promolta is a self-service video advertising platform that promotes YouTube
  and other videos across a network of blogs, websites, mobile apps, and social
  networks to grow views, subscribers, and engagement. Advertisers fund campaigns
  and target audiences, while publishers in the Promolta network earn by
  distributing sponsored video content. Promolta is a portfolio company of
  500 Global. Campaigns start at a $10 minimum budget, go live within 24 hours,
  and can be optimized for views, YouTube likes, YouTube subscribers, or mobile
  app installs, with targeting by age, gender, location, and keyword. As of the
  2026-08-12 enrichment pass the company publishes no public developer API, SDK,
  OpenAPI/GraphQL contract, developer portal, or webhook surface — this profile
  captures its public web, legal, blog, and domain-security footprint.
